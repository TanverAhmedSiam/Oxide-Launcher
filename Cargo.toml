[package]
name = "rmcl"
version = "1.0.1"
license = "AGPL-3.0-only"
edition = "2021"
default-run = "oxide-launcher"

# The launcher itself is oxide-launcher.exe; the command-line tool stays rmcl-cli.
[[bin]]
name = "oxide-launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
egui-phosphor = "0.7"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
directories = "5"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
md5 = "0.7"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

# Small binary + low memory
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "none"
debug = "line-tables-only"
